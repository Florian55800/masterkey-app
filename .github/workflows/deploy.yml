name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/debian/masterkey-app
            sudo chown -R debian:debian .
            git pull origin main
            docker compose down
            docker compose build --no-cache app
            docker compose up -d
            echo "=== Docker status ==="
            docker compose ps
            echo "=== Proxy services ==="
            sudo systemctl status nginx 2>&1 | head -5 || echo "nginx not found"
            sudo systemctl status caddy 2>&1 | head -5 || echo "caddy not found"
            echo "=== Restart proxy ==="
            sudo systemctl restart nginx 2>&1 || sudo systemctl restart caddy 2>&1 || echo "no proxy service found"
            echo "=== Listening ports ==="
            sudo ss -tlnp | grep -E ':80|:443|:3000'
