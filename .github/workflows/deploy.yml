name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/debian/masterkey-app
            sudo chown -R debian:debian .
            git pull origin main
            docker compose down
            docker compose build --no-cache app
            docker compose up -d
            grep -q 'client_max_body_size' /etc/nginx/sites-enabled/default || sudo sed -i 's/server {/server {\n\tclient_max_body_size 50m;/' /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl reload nginx
