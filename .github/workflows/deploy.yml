name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/debian/masterkey-app
            sudo chown -R debian:debian .
            git pull origin main
            docker compose down
            docker compose build --no-cache app
            docker compose up -d
            echo "=== Nginx error ==="
            sudo nginx -t 2>&1
            sudo journalctl -u nginx -n 20 --no-pager 2>&1
